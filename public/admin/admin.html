<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Choix Catégorie Question</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <label>Style :
  <select id="theme-select">
    <option value="violet">Violet</option>
    <option value="orange">Orange</option>
  </select>
</label>
  <h2 style="text-align:center;">Envoyer une question (par catégorie) sur OBS</h2>
  <center><div id="categories"></div></center>
  <div id="question-preview"></div>
  <div id="general-controls">
    <button id="show-propositions">Afficher les propositions</button>
    <div id="selection-buttons">
      <button id="a">A</button>
      <button id="b">B</button>
      <button id="c">C</button>
      <button id="d">D</button>
    </div>
    <button id="validate">Valider</button>
  <div id="thematique-controls">
    <button id="show-rond">Rond (2 choix)</button>
    <button id="show-carre">Carré (4 choix)</button>
  </div>
  <button id="reset-display">Reset affichage OBS</button>
  </div>
  
  <section id="chrono-controls">
  <h3>⏱ Gestion des Chronos</h3>
  <div class="chrono-block">
    <span>Chrono Gauche</span>
    <button id="chrono-left-start">Start</button>
    <button id="chrono-left-pause">Pause</button>
    <button id="chrono-left-reset">Reset</button>
  </div>
  <div class="chrono-block">
    <span>Chrono Droit</span>
    <button id="chrono-right-start">Start</button>
    <button id="chrono-right-pause">Pause</button>
    <button id="chrono-right-reset">Reset</button>
  </div>
</section>

  <div id="bottom-links">
    <a href="/obs/obs.html" target="_blank">Ouvrir OBS Overlay</a>
    <a href="#" id="copy-obs-link">Copier le lien OBS</a>
  </div>
  
  <script type="module" src="./admin.js"></script>
</body>
</html>
